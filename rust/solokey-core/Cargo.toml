[package]
name = "solokey-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nucleo de SoloKey: cripto, formato de boveda, BD y sync (ADR-0008)"
publish = false

[lib]
name = "solokey_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
aes-gcm = { version = "0.10", features = ["zeroize"] }
base64 = "0.22"
argon2 = { version = "0.5", features = ["zeroize"] }
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
