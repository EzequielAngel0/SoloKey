name: solokey
description: Local-First Password Manager — Secure Vault for Android.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # ── Internationalisation (i18n) ───────────────────────────────
  flutter_localizations:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # ── Immutable Models ──────────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ── Dependency Injection ──────────────────────────────────────
  get_it: ^9.0.0
  injectable: ^2.5.0

  # ── Navigation ────────────────────────────────────────────────
  go_router: ^18.1.4

  # ── Database (Drift / SQLite) ─────────────────────────────────
  drift: ^2.28.2
  drift_flutter: ^0.2.7

  # ── Secure Storage (Android Keystore) ────────────────────────
  flutter_secure_storage: ^10.3.4

  # ── Cryptography (AES-256-GCM + Argon2id) ────────────────────
  cryptography: ^2.7.0

  # ── Biometrics ────────────────────────────────────────────────
  local_auth: ^3.0.2

  # ── Screen Security (FLAG_SECURE) ────────────────────────────

  # ── Utilities ─────────────────────────────────────────────────
  uuid: ^4.5.1
  equatable: ^3.0.0
  crypto: ^3.0.0   # SHA-1 k-Anonymity (HaveIBeenPwned) en SecurityAuditService
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  otp: ^3.2.0
  share_plus: ^12.0.2
  file_picker: ^11.0.0
  mobile_scanner: ^7.2.0
  url_launcher: ^6.3.2   # "Abrir sitio" desde el detalle de credencial

  # ── Desktop & Sync & P2P ──────────────────────────────────────
  window_manager: ^0.5.1
  tray_manager: ^0.5.0
  nsd: ^5.0.0
  shelf: ^1.4.1
  shelf_web_socket: ^2.0.0
  shelf_router: ^1.1.4
  qr_flutter: ^4.1.0
  web_socket_channel: ^3.0.3
  # 0.8.x cambia como aplica Kotlin en Android y con AGP 8 el build release no encuentra su plugin (pla-4).
  desktop_drop: ">=0.7.1 <0.8.0"

  # ── Native Notifications & Background Services ─────────────────
  # 23 pide compileSdk 37 y AGP 9.1 (androidx.core 1.19): pla-4.
  flutter_local_notifications: ^22.3.3
  local_notifier: ^0.1.6
  workmanager: ^0.10.0
  launch_at_startup: ^0.5.1
  hotkey_manager: ^0.2.3
  windows_single_instance: ^1.1.0

  # ── Captura de QR de pantalla en escritorio (TOTP) ────────────
  screen_capturer: ^0.2.3   # captura de region de pantalla (Windows/macOS/Linux)
  zxing2: ^0.2.4            # decodificador de QR puro Dart sobre la imagen
  image: ^4.8.0            # decodifica el PNG capturado a pixeles para zxing2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Integration testing (E2E on a real device/desktop) ────────
  integration_test:
    sdk: flutter

  # ── Code Generation ───────────────────────────────────────────
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.0
  injectable_generator: ^2.6.2
  # 2.32+ pide sqlite3 3 y drift_flutter 0.3, y un analyzer que freezed 3.2 estable no acepta (pla-4).
  drift_dev: ">=2.28.0 <2.32.0"

  # ── Linting ───────────────────────────────────────────────────
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/

  # Tipografia bundleada offline (sin red, coherente con local-first).
  # Tinta y papel (DIS-1): Atkinson Hyperlegible Next y Mono (OFL), un .ttf fijo
  # por peso, sacados de la variable de google/fonts (ver CHANGELOG).
  fonts:
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-400.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-500.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-600.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-700.ttf
          weight: 700
    - family: Atkinson Hyperlegible Mono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono-400.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleMono-500.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleMono-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/solokey_icon.png"
  adaptive_icon_background: "#0E0E13"
  adaptive_icon_foreground: "assets/logo/solokey_adaptive_fg.png"
  min_sdk_android: 21
  # Windows: el .ico del runner (windows/runner/resources/app_icon.ico) se genera
  # MANUALMENTE multi-tamano (16,24,32,48,64,128,256). El plugin con icon_size:256
  # solo metia UN frame 256, por lo que el icono salia en blanco en la barra de
  # titulo y la barra de tareas. Por eso aqui generate:false y no lo tocamos.
  windows:
    generate: false
