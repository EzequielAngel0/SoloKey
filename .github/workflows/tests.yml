name: tests

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  analyze-test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Dependencies
        run: flutter pub get

      # Nucleo Rust (NUC-1): las pruebas que usan la cripto real lo cargan de rust/dist/.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.1'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Nucleo Rust (.so de Linux)
        working-directory: rust
        run: |
          cargo build --release --locked -p solokey-core
          mkdir -p dist && cp target/release/libsolokey_core.so dist/

      # Los archivos generados (.g.dart/.freezed.dart/l10n) estan versionados,
      # asi que no hace falta build_runner/gen-l10n en CI.
      - name: Analyze
        run: flutter analyze

      # Solo unit/widget (test/**). Los integration_test/** van en los jobs
      # e2e-windows y e2e-android.
      - name: Test + coverage
        run: flutter test --coverage

      - name: Coverage gate
        run: dart run tool/check_coverage.dart "$(cat tool/coverage_min.txt)"

  # E2E de escritorio (CAL-5). vault_e2e_test BORRA la boveda: aqui no hay una real
  # (runner desechable). En el equipo del duenio, solo con run_integration_tests.ps1.
  # Un archivo por invocacion (en Windows no se pueden encadenar) y cada corrida en su
  # paso, para que un fallo de la primera no lo tape la segunda.
  # windows-2022 = Visual Studio 2022, el mismo del release (build_release.ps1). Con
  # windows-latest (VS 18, MSVC 14.51) local_auth_windows y
  # flutter_local_notifications_windows no compilan (error STL1011, <experimental/coroutine>).
  e2e-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Dependencies
        run: flutter pub get

      # Nucleo Rust (NUC-1): CMake empaqueta rust/dist/solokey_core.dll junto al .exe. En el runner se
      # compila nativo; en el equipo del duenio sale cruzada en Podman (tool\build.ps1 -Nucleo).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.1'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Nucleo Rust (DLL)
        working-directory: rust
        shell: bash
        run: |
          cargo build --release --locked -p solokey-core
          mkdir -p dist && cp target/release/solokey_core.dll dist/

      # Datos aislados (NUC-6): la app y resetVault solo tocan esta carpeta.
      - name: E2E app_boot_test (no destructivo)
        run: flutter test integration_test/app_boot_test.dart -d windows --dart-define=SOLOKEY_DATA_DIR=${{ runner.temp }}\solokey-e2e

      - name: E2E sync_v2_test (sync v2 contra un par del nucleo, loopback)
        run: flutter test integration_test/sync_v2_test.dart -d windows --dart-define=E2E_ALLOW_WIPE=1 --dart-define=SOLOKEY_DATA_DIR=${{ runner.temp }}\solokey-e2e

      - name: E2E migracion_v1_test (boveda de prueba de vectores/v1)
        run: flutter test integration_test/migracion_v1_test.dart -d windows --dart-define=E2E_ALLOW_WIPE=1 --dart-define=SOLOKEY_DATA_DIR=${{ runner.temp }}\solokey-e2e --dart-define=SOLOKEY_V1_VECTORS=${{ github.workspace }}\vectores\v1

      - name: E2E vault_e2e_test (corrida 1 de 2)
        run: flutter test integration_test/vault_e2e_test.dart -d windows --dart-define=TEST_DISABLE_BIOMETRIC=1 --dart-define=E2E_ALLOW_WIPE=1 --dart-define=SOLOKEY_DATA_DIR=${{ runner.temp }}\solokey-e2e

      - name: E2E vault_e2e_test (corrida 2 de 2, sobre la boveda que dejo la 1)
        run: flutter test integration_test/vault_e2e_test.dart -d windows --dart-define=TEST_DISABLE_BIOMETRIC=1 --dart-define=E2E_ALLOW_WIPE=1 --dart-define=SOLOKEY_DATA_DIR=${{ runner.temp }}\solokey-e2e

  # Nucleo Rust (ADR-0008): pruebas y clippy. La misma toolchain que tool/build/Containerfile.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.1'
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # E2E en un emulador de Android desechable (PLA-3, ADR-0011). Aqui SI se permite borrar
  # la boveda: el emulador nace vacio y muere con el job.
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Dependencies
        run: flutter pub get

      # Nucleo Rust (NUC-1): Gradle toma rust/dist/jniLibs/<abi>/libsolokey_core.so. Solo x86_64 (el emulador).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.1'
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Nucleo Rust (.so de Android)
        working-directory: rust
        run: |
          cargo install --locked cargo-ndk
          cargo ndk -t x86_64 -o dist/jniLibs build --release --locked -p solokey-core

      - name: E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # La app pide el permiso de notificaciones antes de runApp y flutter test la desinstala al
          # acabar cada archivo: uno por uno, instalando antes con -g (permisos concedidos).
          # El runner corre cada linea por separado, por eso el bucle va en una sola.
          script: |
            flutter build apk --debug
            set -e; for f in integration_test/*_test.dart; do adb install -g build/app/outputs/flutter-apk/app-debug.apk; timeout 900 flutter test "$f" -d emulator-5554 --dart-define=E2E_ALLOW_WIPE=1 --dart-define=TEST_DISABLE_BIOMETRIC=1 --dart-define=SOLOKEY_DATA_DIR=e2e; done
